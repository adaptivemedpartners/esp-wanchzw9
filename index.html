<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0f14" />
<title>Ethan #19 · Game Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0b0f14;--panel:#141b24;--panel2:#1b2430;--navy:#0f2140;--line:rgba(255,255,255,.08);--txt:#eef2f6;--muted:#93a1b2;
    --turf:#39ff6a;--turf-d:#1db954;--orange:#ff7a1a;--red:#e63946;--gold:#ffc83d}
  *{box-sizing:border-box} html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{margin:0;font-family:"Inter",system-ui,sans-serif;color:var(--txt);line-height:1.45;min-height:100vh;background:
    radial-gradient(ellipse 80% 30% at 50% 0%,rgba(57,255,106,.08),transparent 60%),
    repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.025) 79px 80px),var(--bg)}
  .wrap{width:100%;max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 max(36px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#0e141c,#0b0f14 40%);border-left:1px solid var(--line);border-right:1px solid var(--line)}
  /* hero: stadium + turf stripes + yard lines */
  .hero{position:relative;overflow:hidden;padding:30px 20px 22px;background:
      repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.07) 46px 48px),
      repeating-linear-gradient(90deg,#0f3d22 0 24px,#0c341d 24px 48px);
    border-bottom:4px solid var(--turf)}
  .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,20,.88) 0%,rgba(15,33,64,.72) 55%,rgba(11,15,20,.35) 100%)}
  .hero>*{position:relative}
  .eyebrow{font:600 12px "Oswald",sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--turf);margin:0 0 4px}
  .jersey{display:flex;align-items:flex-end;gap:14px}
  .names{font-family:"Bebas Neue","Oswald",sans-serif;font-weight:400;font-size:88px;line-height:.86;margin:0;letter-spacing:.02em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}
  .num{font-family:"Bebas Neue",sans-serif;font-size:88px;line-height:.86;color:transparent;-webkit-text-stroke:2px var(--orange);text-shadow:4px 4px 0 rgba(255,122,26,.25)}
  .hero-sub{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;font:600 13px "Oswald",sans-serif;letter-spacing:.12em;text-transform:uppercase}
  .hero-sub span{background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:4px;padding:4px 9px}
  .hero-sub .s{color:var(--turf);border-color:rgba(57,255,106,.4)} .hero-sub .f{color:var(--orange);border-color:rgba(255,122,26,.45)}
  section{padding:20px 16px 4px}
  h2{font:700 24px "Oswald",sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px;display:flex;align-items:center;gap:10px}
  h2:before{content:"";width:6px;height:22px;background:var(--turf);transform:skewX(-14deg)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  /* scoreboard next up */
  .next{padding:0;overflow:hidden;border:2px solid #263241;background:#090c10;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03)}
  .next.soccer-next{border-color:rgba(57,255,106,.55)} .next.football-next{border-color:rgba(255,122,26,.6)}
  .sb-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(90deg,var(--navy),#14294d);border-bottom:2px solid #000}
  .next .lbl{font:700 14px "Oswald",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#fff;margin:0}
  .sb-date{margin:0;font:600 14px "Oswald",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
  .sb-board{margin:14px 14px 8px;padding:10px 12px 8px;border-radius:6px;text-align:center;
    background:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/6px 6px,#050608;border:1px solid #1f2a36}
  .sb-cap{font:700 13px "Oswald",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .next .leave{font-family:"Bebas Neue",sans-serif;font-size:76px;line-height:.95;color:var(--gold);text-shadow:0 0 18px rgba(255,200,61,.45)}
  .next.soccer-next .leave{color:var(--turf);text-shadow:0 0 18px rgba(57,255,106,.45)}
  .next .leave small{font-size:28px;color:var(--muted);text-shadow:none}
  .next .what{font:600 20px "Oswald",sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:4px 14px 4px}
  .next>.meta,.next>p.meta{margin:2px 14px} .next>.meta:last-child{margin-bottom:14px}
  .meta{color:var(--muted);font-size:14px;margin:3px 0}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid #2a3644;background:var(--panel2);color:var(--txt);border-radius:4px;padding:8px 14px;font:600 14px "Oswald",sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transform:skewX(-8deg)}
  .chip.on{background:var(--turf);color:#04140a;border-color:var(--turf)}
  .week{font:600 13px "Oswald",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:10px}
  .week:after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,#2d3a49 0 8px,transparent 8px 14px)}
  .ev{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid #3a4656;border-radius:8px;padding:11px 12px;margin:0 0 8px}
  .ev.soccer-ev{border-left-color:var(--turf-d)} .ev.football-ev{border-left-color:var(--orange)}
  .ev.dim{opacity:.45;filter:grayscale(.8)}
  .ev .body{min-width:0;flex:1}
  .d{min-width:50px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
  .d .dow{font:700 12px "Oswald",sans-serif;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .d .dn{font-family:"Bebas Neue",sans-serif;font-size:38px;line-height:.95;color:#fff}
  .d .mo{font:600 11px "Oswald",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .t{font:600 17px "Oswald",sans-serif;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
  .x{font-size:14px;color:#cfd8e2}
  .tag{display:inline-flex;align-items:center;gap:4px;font:700 11px "Oswald",sans-serif;letter-spacing:.12em;padding:2px 8px;border-radius:3px;margin:0 4px 3px 0;text-transform:uppercase;vertical-align:middle}
  .tag i{font-style:normal;font-size:12px;letter-spacing:0}
  .soccer{background:rgba(57,255,106,.14);color:var(--turf);border:1px solid rgba(57,255,106,.35)}
  .football{background:rgba(255,122,26,.14);color:var(--orange);border:1px solid rgba(255,122,26,.4)}
  .practice{background:rgba(120,160,255,.12);color:#9db8ff;border:1px solid rgba(120,160,255,.3)}
  .setting,.tourney{background:rgba(255,255,255,.06);color:#d6dee8;border:1px solid rgba(255,255,255,.15)}
  .flag{background:rgba(230,57,70,.15);color:#ff8a93;border:1px solid rgba(230,57,70,.4)}
  .leavepill{display:inline-block;background:var(--gold);color:#111;border-radius:3px;padding:2px 9px;font:700 14px "Oswald",sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .soccer-ev .leavepill{background:var(--turf);color:#04140a}
  .tbd{color:var(--red);font-weight:700}
  a{color:#7fd4ff;text-decoration:none;border-bottom:1px solid rgba(127,212,255,.35)}
  ul{margin:0;padding-left:20px} li{margin:8px 0;font-size:14.5px}
  footer{padding:20px 16px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:18px}
  footer strong{color:var(--txt);font:600 14px "Oswald",sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .hidden{display:none!important}
  @media (min-width:700px){
    .wrap{box-shadow:0 0 60px rgba(0,0,0,.6)}
    .hero{padding:44px 32px 28px} .names,.num{font-size:120px}
    section{padding:24px 28px 6px} footer{padding:22px 28px}
    .next .leave{font-size:96px}
    .chips{flex-wrap:wrap;overflow:visible}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Freeman · Fall 2026 · Game Day</p>
    <div class="jersey"><h1 class="names">Ethan</h1><span class="num">#19</span></div>
    <p class="hero-sub"><span class="s">⚽ Soccer</span><span class="f">🏈 Football</span><span>All times CT</span></p>
  </header>

  <div id="app">
    <section><div class="card next" id="next"></div></section>
    <section>
      <h2>Upcoming</h2>
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </section>
    <section><h2>Reminders</h2><div class="card"><ul id="rem-list"></ul></div></section>
    <section id="recent-sec"><h2>Recent</h2><div id="recent"></div></section>
    <footer id="foot"></footer>
  </div>
</div>
<script>
(function(){
  var DATA=null, filter="games";
  fetch("data.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){DATA=d;render();});

  // ---- time helpers (everything is America/Chicago) ----
  function nowCT(){var p={};new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
    return {date:p.year+"-"+p.month+"-"+p.day,time:p.hour+":"+p.minute};}
  function toMin(t){var a=t.split(":");return +a[0]*60+ +a[1]}
  function fromMin(m){m=(m+1440)%1440;var h=Math.floor(m/60),mm=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+(mm<10?"0":"")+mm+" "+ap}
  function fmtT(t){return fromMin(toMin(t))}
  function dObj(s){var a=s.split("-");return new Date(Date.UTC(+a[0],a[1]-1,+a[2]))}
  function dStr(d){return d.toISOString().slice(0,10)}
  var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function nice(s){var d=dObj(s);return DOW[d.getUTCDay()]+" "+MON[d.getUTCMonth()]+" "+d.getUTCDate()}
  function weekStart(s){var d=dObj(s);var k=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-k);return dStr(d)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function expand(){
    var out=DATA.events.slice();
    (DATA.recurring||[]).forEach(function(r){
      var d=dObj(r.from),end=dObj(r.until);
      while(d<=end){var s=dStr(d);
        if(r.days.indexOf(DOW[d.getUTCDay()])>=0){var ex=(r.exceptions||{})[s]||{};
          out.push({id:r.id+"-"+s,sport:r.sport,kind:r.kind,title:r.title,detail:r.detail,date:s,start:r.start,end:r.end,
            place:ex.place_text?null:r.place,place_text:ex.place_text||null,field:("field" in ex)?ex.field:r.field});}
        d.setUTCDate(d.getUTCDate()+1);}
    });
    out.forEach(function(e){
      e.leave=null;
      if(e.sport==="soccer"&&e.kind==="game"&&e.start&&e.setting){
        var m=e.setting==="outdoor"?DATA.rules.outdoor_soccer_leave_min:DATA.rules.indoor_soccer_leave_min;
        e.leave=fromMin(toMin(e.start)-m);}
    });
    out.sort(function(a,b){return (a.date+(a.start||"99")).localeCompare(b.date+(b.start||"99"))});
    return out;
  }
  function placeHTML(e){
    if(e.place_text) return esc(e.place_text);
    if(!e.place) return '<span class="tbd">Place TBD</span>';
    var p=DATA.places[e.place]; var q=encodeURIComponent(p.address?p.name+", "+p.address:p.name);
    return '<a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+esc(p.name)+'</a>'+(e.field?" · "+esc(e.field):"");
  }
  function timeHTML(e){
    if(!e.start) return '<span class="tbd">Time TBD</span>';
    return fmtT(e.start)+(e.end?"–"+fmtT(e.end):"")+" CT";
  }
  function isPast(e,n){var last=e.end_date||e.date; if(last<n.date) return true;
    if(last>n.date) return false; var t=e.end||e.start; return t? toMin(t)+(e.end?0:90)<toMin(n.time):false;}
  var ICON={soccer:"\u26BD",football:"\uD83C\uDFC8"};
  function sportTag(s){return '<span class="tag '+s+'">'+(ICON[s]?'<i>'+ICON[s]+'</i>':'')+s+'</span>'}
  function tags(e){var h=sportTag(e.sport);
    if(e.kind==="practice") h+='<span class="tag practice">practice</span>';
    if(e.kind==="tournament") h+='<span class="tag tourney">tournament</span>';
    if(e.setting) h+='<span class="tag setting">'+e.setting+'</span>';
    if(e.flag) h+='<span class="tag flag">'+esc(e.flag)+'</span>';
    return h;}
  function row(e){
    var d=dObj(e.date),dates=e.end_date?nice(e.date)+" – "+nice(e.end_date):"";
    return '<div class="ev '+e.sport+'-ev'+(e.not_ethan?" dim":"")+'"><div class="d"><div class="dow">'+DOW[d.getUTCDay()]+'</div><div class="dn">'+d.getUTCDate()+'</div><div class="mo">'+MON[d.getUTCMonth()]+(e.date_approx?" ~":"")+'</div></div><div class="body">'
      +tags(e)+'<div class="t">'+esc(e.title)+'</div><div class="x">'+esc(e.detail)+'</div>'
      +(dates?'<div class="meta">'+dates+'</div>':"")
      +(e.leave?'<div class="meta"><span class="leavepill">Leave by '+e.leave+' CT</span></div>':"")
      +'<div class="meta">'+(e.kind==="tournament"&&!e.start?"":timeHTML(e)+" · ")+placeHTML(e)+(e.kit?" · "+esc(e.kit):"")+'</div>'
      +(e.notes?'<div class="meta">'+esc(e.notes)+'</div>':"")
      +(e.link?'<div class="meta"><a href="'+esc(e.link.url)+'" target="_blank" rel="noopener">'+esc(e.link.label)+'</a></div>':"")
      +'</div></div>';
  }
  function render(){
    var n=nowCT(),all=expand();
    var up=all.filter(function(e){return !isPast(e,n)}), past=all.filter(function(e){return isPast(e,n)&&e.kind!=="practice"}).reverse();
    var nx=up.filter(function(e){return e.kind!=="practice"&&!e.not_ethan})[0];
    var N=document.getElementById("next");
    if(nx){
      var cap=nx.leave?'Leave by':(nx.start?(nx.sport==="football"?"Game time":"Start"):"Time");
      var big=nx.leave?(nx.leave+' <small>CT</small>'):(nx.start?fmtT(nx.start)+' <small>CT</small>':'<span class="tbd">TBD</span>');
      N.className="card next "+nx.sport+"-next";
      N.innerHTML='<div class="sb-top"><p class="lbl">Next up</p><p class="sb-date">'+(ICON[nx.sport]||"")+' '+nice(nx.date)+(nx.end_date?" – "+nice(nx.end_date):"")+'</p></div>'
        +'<div class="sb-board"><div class="sb-cap">'+cap+'</div><div class="leave">'+big+'</div></div>'
        +'<div class="what">'+esc(nx.title)+' — '+esc(nx.detail)+'</div>'
        +(nx.start?'<p class="meta">'+(nx.sport==="soccer"&&nx.kind==="game"?"Kickoff ":"")+timeHTML(nx)+'</p>':"")
        +'<p class="meta">'+placeHTML(nx)+(nx.kit?" · "+esc(nx.kit):"")+'</p>'+(nx.notes?'<p class="meta">'+esc(nx.notes)+'</p>':"");
    } else N.innerHTML='<p class="lbl">Next up</p><p class="meta">Nothing scheduled yet.</p>';
    var C=[["games","Games & events"],["soccer","Soccer"],["football","Football"],["practice","Practice"],["all","Everything"]];
    document.getElementById("chips").innerHTML=C.map(function(c){return '<button class="chip'+(filter===c[0]?" on":"")+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(b){b.onclick=function(){filter=b.dataset.f;render()}});
    var sel=up.filter(function(e){
      if(filter==="all") return true; if(filter==="practice") return e.kind==="practice";
      if(filter==="games") return e.kind!=="practice"; return e.sport===filter&&e.kind!=="practice";});
    var html="",wk=null;
    sel.forEach(function(e){var w=weekStart(e.date); if(w!==wk){wk=w;html+='<div class="week">Week of '+nice(w)+'</div>';} html+=row(e);});
    document.getElementById("list").innerHTML=html||'<p class="meta">Nothing here yet.</p>';
    document.getElementById("rem-list").innerHTML=DATA.reminders.map(function(r){return '<li>'+sportTag(r.sport)+esc(r.text)+'</li>'}).join("");
    document.getElementById("recent").innerHTML=past.map(row).join("");
    document.getElementById("recent-sec").classList.toggle("hidden",!past.length);
    var u=new Date(DATA.updated),us=u.toLocaleString("en-US",{timeZone:"America/Chicago",weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    document.getElementById("foot").innerHTML='<p><strong>Updated '+us+' CT</strong></p><p>Soccer: '+esc(DATA.teams.soccer.name)+' · jersey '+esc(DATA.teams.soccer.jersey)+'<br>Football: '+esc(DATA.teams.football.name)+' · '+esc(DATA.teams.football.coach)+'</p><p>Sources:</p><ul>'+DATA.sources.map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ul>';
  }
})();
</script>
</body>
</html>
