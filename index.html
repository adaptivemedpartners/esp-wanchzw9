<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f3e4e8" />
<title>Ethan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--blush:#f6e8ec;--rose:#d4b0ba;--dusty:#b88996;--ink:#3d3336;--muted:#7a6a6e;--cream:#fbf7f2;--sand:#f3ebe3;--champagne:#c9b896;--gold:#b8a07a;--ocean:#6fa8b2;--ocean-deep:#3d7a84;--card:#fffdfb;--line:rgba(184,160,122,.35);--warn:#a8642a}
  *{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:"Nunito",system-ui,sans-serif;color:var(--ink);line-height:1.5;min-height:100vh;
    background:radial-gradient(ellipse 90% 40% at 50% 0%,#f8eef1 0%,transparent 55%),linear-gradient(180deg,#fbf7f2 0%,#f6e8ec 42%,#eef4f5 100%)}
  .wrap{width:100%;max-width:430px;margin:0 auto;min-height:100vh;padding:0 0 max(36px,env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#fffaf7 0%,#fbf6f3 28%,#f7eef1 70%,#f3f7f8 100%);box-shadow:0 0 0 1px rgba(201,184,150,.18),0 18px 50px rgba(61,51,54,.08)}
  .hero{padding:34px 22px 22px;text-align:center;background:linear-gradient(160deg,#3d7a84 0%,#6fa8b2 55%,#b88996 100%);color:#fffaf7}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#f3e6c8;margin:0 0 6px}
  .names{font-family:"Great Vibes",cursive;font-size:52px;line-height:1.05;margin:0 0 4px;font-weight:400;text-shadow:0 2px 16px rgba(0,0,0,.2)}
  .hero-sub{font-family:"Cormorant Garamond",serif;font-size:18px;font-style:italic;margin:0;color:#fff6ee}
  .rule{width:72px;height:1px;margin:10px auto 8px;background:linear-gradient(90deg,transparent,#e8d5b0,transparent)}
  section{padding:18px 18px 6px}
  h2{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;margin:0 0 10px;color:var(--ocean-deep)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 22px rgba(61,51,54,.06)}
  .next .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dusty);font-weight:800;margin:0}
  .next .leave{font-size:44px;font-weight:800;line-height:1.05;margin:6px 0 2px;color:var(--ink)}
  .next .leave small{font-size:16px;font-weight:700;color:var(--muted)}
  .next .what{font-family:"Cormorant Garamond",serif;font-size:22px;margin:6px 0 2px}
  .meta{color:var(--muted);font-size:14px;margin:2px 0}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--dusty);border-radius:999px;padding:7px 14px;font:600 13px "Nunito",sans-serif;cursor:pointer}
  .chip.on{background:var(--ocean-deep);color:#fff;border-color:var(--ocean-deep)}
  .week{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--gold);margin:16px 2px 6px}
  .ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:0 0 8px}
  .ev.dim{opacity:.62}
  .d{min-width:52px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
  .d .dow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--dusty);text-transform:uppercase}
  .d .dn{font-family:"Cormorant Garamond",serif;font-size:28px;line-height:1}
  .d .mo{font-size:11px;color:var(--muted)}
  .t{font-weight:800;font-size:15px}
  .x{font-size:14px}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px;margin:0 4px 3px 0;text-transform:uppercase;vertical-align:middle}
  .soccer{background:#e4f1f3;color:var(--ocean-deep)} .football{background:#f4ece0;color:#8a6a35}
  .practice{background:#efe9f3;color:#7b5a8a} .flag{background:#fbe7dc;color:var(--warn)}
  .leavepill{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-weight:800;font-size:13px}
  .tbd{color:var(--warn);font-weight:700}
  a{color:var(--ocean-deep)}
  ul{margin:0;padding-left:20px} li{margin:6px 0;font-size:14.5px}
  footer{padding:18px;color:var(--muted);font-size:12.5px}
  .btn{display:inline-block;background:var(--ocean-deep);color:#fff;border:0;border-radius:999px;padding:11px 22px;font:700 15px "Nunito",sans-serif;cursor:pointer}
  .btn-ghost{background:none;border:0;color:var(--dusty);font:600 13px "Nunito",sans-serif;text-decoration:underline;cursor:pointer}
  #login{padding:28px 22px}
  #login input[type=password]{width:100%;font:16px "Nunito",sans-serif;padding:12px 14px;border:1px solid var(--rose);border-radius:12px;margin:10px 0;background:#fff}
  #err{color:#a33;font-size:14px;min-height:20px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Freeman family · Fall 2026</p>
    <h1 class="names">Ethan</h1>
    <div class="rule"></div>
    <p class="hero-sub">Soccer &amp; football · all times Central (CT)</p>
  </header>

  <div id="login">
    <div class="card">
      <h2 style="margin-top:0">Sign in</h2>
      <p class="meta">This page is private to the family. Enter the shared password.</p>
      <form id="lf" autocomplete="on">
        <input type="text" name="username" value="family" autocomplete="username" style="display:none" />
        <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required />
        <label class="meta"><input id="rem" type="checkbox" checked /> Keep me signed in on this phone</label>
        <div id="err"></div>
        <button class="btn" type="submit" id="go">Open</button>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <section><div class="card next" id="next"></div></section>
    <section>
      <h2>Upcoming</h2>
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </section>
    <section><h2>Reminders</h2><div class="card"><ul id="rem-list"></ul></div></section>
    <section id="recent-sec"><h2>Recent</h2><div id="recent"></div></section>
    <footer id="foot"></footer>
  </div>
</div>
<script>
(function(){
  var KEY="ethan-sports-pw", DATA=null, filter="games";
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  async function decrypt(pw){
    var r=await fetch("data.enc.json",{cache:"no-store"}); var e=await r.json();
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function tryLogin(pw,remember,silent){
    var err=document.getElementById("err"); err.textContent=silent?"":"Checking…";
    try{ DATA=await decrypt(pw); }catch(x){ if(!silent) err.textContent="That password didn't work."; localStorage.removeItem(KEY); return; }
    if(remember) localStorage.setItem(KEY,pw);
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    render();
  }
  document.getElementById("lf").addEventListener("submit",function(ev){ev.preventDefault();
    tryLogin(document.getElementById("pw").value,document.getElementById("rem").checked,false);});
  var saved=localStorage.getItem(KEY); if(saved) tryLogin(saved,true,true);

  // ---- time helpers (everything is America/Chicago) ----
  function nowCT(){var p={};new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
    return {date:p.year+"-"+p.month+"-"+p.day,time:p.hour+":"+p.minute};}
  function toMin(t){var a=t.split(":");return +a[0]*60+ +a[1]}
  function fromMin(m){m=(m+1440)%1440;var h=Math.floor(m/60),mm=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+(mm<10?"0":"")+mm+" "+ap}
  function fmtT(t){return fromMin(toMin(t))}
  function dObj(s){var a=s.split("-");return new Date(Date.UTC(+a[0],a[1]-1,+a[2]))}
  function dStr(d){return d.toISOString().slice(0,10)}
  var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function nice(s){var d=dObj(s);return DOW[d.getUTCDay()]+" "+MON[d.getUTCMonth()]+" "+d.getUTCDate()}
  function weekStart(s){var d=dObj(s);var k=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-k);return dStr(d)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function expand(){
    var out=DATA.events.slice();
    (DATA.recurring||[]).forEach(function(r){
      var d=dObj(r.from),end=dObj(r.until);
      while(d<=end){var s=dStr(d);
        if(r.days.indexOf(DOW[d.getUTCDay()])>=0){var ex=(r.exceptions||{})[s]||{};
          out.push({id:r.id+"-"+s,sport:r.sport,kind:r.kind,title:r.title,detail:r.detail,date:s,start:r.start,end:r.end,
            place:ex.place_text?null:r.place,place_text:ex.place_text||null,field:("field" in ex)?ex.field:r.field});}
        d.setUTCDate(d.getUTCDate()+1);}
    });
    out.forEach(function(e){
      e.leave=null;
      if(e.sport==="soccer"&&e.kind==="game"&&e.start&&e.setting){
        var m=e.setting==="outdoor"?DATA.rules.outdoor_soccer_leave_min:DATA.rules.indoor_soccer_leave_min;
        e.leave=fromMin(toMin(e.start)-m);}
    });
    out.sort(function(a,b){return (a.date+(a.start||"99")).localeCompare(b.date+(b.start||"99"))});
    return out;
  }
  function placeHTML(e){
    if(e.place_text) return esc(e.place_text);
    if(!e.place) return '<span class="tbd">Place TBD</span>';
    var p=DATA.places[e.place]; var q=encodeURIComponent(p.address?p.name+", "+p.address:p.name);
    return '<a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+esc(p.name)+'</a>'+(e.field?" · "+esc(e.field):"");
  }
  function timeHTML(e){
    if(!e.start) return '<span class="tbd">Time TBD</span>';
    return fmtT(e.start)+(e.end?"–"+fmtT(e.end):"")+" CT";
  }
  function isPast(e,n){var last=e.end_date||e.date; if(last<n.date) return true;
    if(last>n.date) return false; var t=e.end||e.start; return t? toMin(t)+(e.end?0:90)<toMin(n.time):false;}
  function tags(e){var h='<span class="tag '+e.sport+'">'+e.sport+'</span>';
    if(e.kind==="practice") h+='<span class="tag practice">practice</span>';
    if(e.kind==="tournament") h+='<span class="tag soccer">tournament</span>';
    if(e.setting) h+='<span class="tag soccer">'+e.setting+'</span>';
    if(e.flag) h+='<span class="tag flag">'+esc(e.flag)+'</span>';
    return h;}
  function row(e){
    var d=dObj(e.date),dates=e.end_date?nice(e.date)+" – "+nice(e.end_date):"";
    return '<div class="ev'+(e.not_ethan?" dim":"")+'"><div class="d"><div class="dow">'+DOW[d.getUTCDay()]+'</div><div class="dn">'+d.getUTCDate()+'</div><div class="mo">'+MON[d.getUTCMonth()]+(e.date_approx?" ~":"")+'</div></div><div>'
      +tags(e)+'<div class="t">'+esc(e.title)+'</div><div class="x">'+esc(e.detail)+'</div>'
      +(dates?'<div class="meta">'+dates+'</div>':"")
      +(e.leave?'<div class="meta"><span class="leavepill">Leave '+e.leave+' CT</span></div>':"")
      +'<div class="meta">'+(e.kind==="tournament"&&!e.start?"":timeHTML(e)+" · ")+placeHTML(e)+(e.kit?" · "+esc(e.kit):"")+'</div>'
      +(e.notes?'<div class="meta">'+esc(e.notes)+'</div>':"")
      +(e.link?'<div class="meta"><a href="'+esc(e.link.url)+'" target="_blank" rel="noopener">'+esc(e.link.label)+'</a></div>':"")
      +'</div></div>';
  }
  function render(){
    var n=nowCT(),all=expand();
    var up=all.filter(function(e){return !isPast(e,n)}), past=all.filter(function(e){return isPast(e,n)&&e.kind!=="practice"}).reverse();
    var nx=up.filter(function(e){return e.kind!=="practice"&&!e.not_ethan})[0];
    var N=document.getElementById("next");
    if(nx){
      var big=nx.leave?('Leave '+nx.leave+' <small>CT</small>'):(nx.start?fmtT(nx.start)+' <small>CT '+(nx.sport==="football"?"game time":"start")+'</small>':'<span class="tbd">Time TBD</span>');
      N.innerHTML='<p class="lbl">Next up · '+nice(nx.date)+(nx.end_date?" – "+nice(nx.end_date):"")+'</p><div class="leave">'+big+'</div>'
        +'<div class="what">'+esc(nx.title)+' — '+esc(nx.detail)+'</div>'
        +(nx.start?'<p class="meta">'+(nx.sport==="soccer"&&nx.kind==="game"?"Kickoff ":"")+timeHTML(nx)+'</p>':"")
        +'<p class="meta">'+placeHTML(nx)+(nx.kit?" · "+esc(nx.kit):"")+'</p>'+(nx.notes?'<p class="meta">'+esc(nx.notes)+'</p>':"");
    } else N.innerHTML='<p class="lbl">Next up</p><p class="meta">Nothing scheduled yet.</p>';
    var C=[["games","Games & events"],["soccer","Soccer"],["football","Football"],["practice","Practice"],["all","Everything"]];
    document.getElementById("chips").innerHTML=C.map(function(c){return '<button class="chip'+(filter===c[0]?" on":"")+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(b){b.onclick=function(){filter=b.dataset.f;render()}});
    var sel=up.filter(function(e){
      if(filter==="all") return true; if(filter==="practice") return e.kind==="practice";
      if(filter==="games") return e.kind!=="practice"; return e.sport===filter&&e.kind!=="practice";});
    var html="",wk=null;
    sel.forEach(function(e){var w=weekStart(e.date); if(w!==wk){wk=w;html+='<div class="week">Week of '+nice(w)+'</div>';} html+=row(e);});
    document.getElementById("list").innerHTML=html||'<p class="meta">Nothing here yet.</p>';
    document.getElementById("rem-list").innerHTML=DATA.reminders.map(function(r){return '<li><span class="tag '+r.sport+'">'+r.sport+'</span>'+esc(r.text)+'</li>'}).join("");
    document.getElementById("recent").innerHTML=past.map(row).join("");
    document.getElementById("recent-sec").classList.toggle("hidden",!past.length);
    var u=new Date(DATA.updated),us=u.toLocaleString("en-US",{timeZone:"America/Chicago",weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    document.getElementById("foot").innerHTML='<p><strong>Updated '+us+' CT</strong></p><p>Soccer: '+esc(DATA.teams.soccer.name)+' · jersey '+esc(DATA.teams.soccer.jersey)+'<br>Football: '+esc(DATA.teams.football.name)+' · '+esc(DATA.teams.football.coach)+'</p><p>Sources:</p><ul>'+DATA.sources.map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ul><p><button class="btn-ghost" id="out">Sign out on this phone</button></p>';
    document.getElementById("out").onclick=function(){localStorage.removeItem(KEY);location.reload()};
  }
})();
</script>
</body>
</html>
